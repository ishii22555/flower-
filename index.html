<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You <3</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a0514;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}
</style>
</head>

<body>

<canvas id="flower"></canvas>

<script>
const canvas = document.getElementById("flower");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

let t = 0;

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    const flowerY = canvas.height * 0.32;
    const stemBottom = canvas.height * 0.82;

    ctx.lineCap = "round";

    // Stem
    ctx.strokeStyle = "#00e6b8";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(cx, flowerY + 20);
    ctx.quadraticCurveTo(
        cx - 20,
        canvas.height * 0.55,
        cx + 35,
        stemBottom
    );
    ctx.stroke();

    // Leaves
    function leaf(x, y, angle) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        ctx.fillStyle = "#00e6b8";
        ctx.beginPath();
        ctx.ellipse(0, 0, 42, 14, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    leaf(cx - 5, canvas.height * 0.57, -0.15);
    leaf(cx + 12, canvas.height * 0.67, 0.15);

    // Flower petals
    ctx.save();
    ctx.translate(cx, flowerY);

    for (let i = 0; i < 12; i++) {
        ctx.rotate(Math.PI * 2 / 12);

        ctx.fillStyle = "#ff8bd8";

        ctx.beginPath();
        ctx.ellipse(0, -38, 20, 42, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // Centre
    ctx.fillStyle = "#ffd34d";
    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // Message
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("my love", cx, flowerY + 100);

    // Heart
    ctx.font = "28px sans-serif";
    ctx.fillText("♥", cx, flowerY + 140);

    requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
