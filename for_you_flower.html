<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You &lt;3</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a0514;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #close {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    color: white;
    font: italic 14px Arial, sans-serif;
    cursor: pointer;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="flower"></canvas>
<div id="close">Click anywhere to close</div>

<script>
const canvas = document.getElementById("flower");
const ctx = canvas.getContext("2d");
const WORD = "my love";

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, innerWidth / 2, innerHeight / 2);
  draw();
}
window.addEventListener("resize", resize);

function drawPetal(base, angle, length, width, color, points = 26) {
  ctx.fillStyle = color;
  ctx.font = "bold 8px Arial";
  ctx.textAlign = "center";
  const [bx, by] = base;
  const cosA = Math.cos(angle), sinA = Math.sin(angle);

  for (let i = 0; i <= points; i++) {
    const theta = i * Math.PI / points;
    const out = length * Math.sin(theta);
    const side = width * Math.sin(theta) * Math.cos(theta);

    const rx = out * cosA - side * sinA;
    const ry = out * sinA + side * cosA;

    ctx.fillText(WORD, bx + rx, by + ry);
  }
}

function drawLeaf(base, angleDeg, length, width) {
  drawPetal(base, angleDeg * Math.PI / 180, length, width, "#2e8b57", 22);
}

function drawStem() {
  ctx.strokeStyle = "#2e8b57";
  ctx.lineWidth = 4;
  ctx.beginPath();

  let x = 0, y = -30;
  ctx.moveTo(x, y);

  // Approximation of the three Turtle circles/arcs
  for (let a = 0; a <= 75; a++) {
    const r = 250;
    const rad = a * Math.PI / 180;
    const nx = x + r * Math.cos((260 - a) * Math.PI / 180);
    const ny = y + r * Math.sin((260 - a) * Math.PI / 180);
    ctx.lineTo(nx, ny);
  }
  ctx.stroke();

  drawLeaf([55, -230], 160, 50, 25);
  drawLeaf([135, -200], 20, 55, 28);
}

const rings = [
  {radius:0, count:4, length:40, width:15, color:"#ffe6f2", offset:45},
  {radius:10, count:5, length:50, width:25, color:"#ffb3d9", offset:0},
  {radius:20, count:7, length:70, width:35, color:"#ff66b2", offset:30},
  {radius:30, count:9, length:90, width:45, color:"#ff1493", offset:15},
  {radius:40, count:12, length:110, width:55, color:"#c71585", offset:0}
];

function draw() {
  ctx.clearRect(-innerWidth/2, -innerHeight/2, innerWidth, innerHeight);

  drawStem();

  for (const ring of rings) {
    for (let i = 0; i < ring.count; i++) {
      const angle = (360 / ring.count) * i + ring.offset;
      const rad = angle * Math.PI / 180;
      const base = [
        ring.radius * Math.cos(rad),
        ring.radius * Math.sin(rad)
      ];
      drawPetal(base, rad, ring.length, ring.width, ring.color);
    }
  }

  ctx.fillStyle = "#ff99cc";
  ctx.font = "bold 10px Courier";
  for (let i = 0; i < 12; i++) {
    const x = Math.floor(Math.random() * 501) - 250;
    const y = Math.floor(Math.random() * 501) - 250;
    if (Math.hypot(x, y) > 130) ctx.fillText("<3", x, y);
  }

  ctx.fillStyle = "white";
  ctx.font = "italic 10px Arial";
  ctx.fillText("Click anywhere to close", 0, Math.min(320, innerHeight/2 - 20));
}

document.body.addEventListener("click", () => {
  document.body.style.opacity = "0";
  document.body.style.transition = "opacity 0.5s";
});

resize();
</script>
</body>
</html>
